[project]
name = "repoward"
version = "0.1.0"
description = "A GitHub MCP server that stops AI agents leaking private code when a malicious issue tells them to."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sanoy" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "prompt-injection", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.9",
    "filelock>=3.20,<5",
    "httpx>=0.28,<0.29",
    "mcp>=2.3,<3",
    "pathspec>=1,<2",
    "pydantic>=2.12,<3",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/Sanoy24/repoward"
Issues = "https://github.com/Sanoy24/repoward/issues"
Changelog = "https://github.com/Sanoy24/repoward/blob/main/CHANGELOG.md"

[project.scripts]
repoward = "repoward.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "respx>=0.23",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoward"]

# An explicit list, so local working files can never end up in a release.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "policy.example.yaml",
    "docs/THREAT_MODEL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not live'"
markers = ["live: needs a real token and sandbox repo (GITHUB_TOKEN, REPOWARD_LIVE_REPO)"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
