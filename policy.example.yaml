# Copy to policy.yaml and edit. Check it with: repoward validate-policy policy.yaml
version: 1
default: deny # the only accepted value

repos:
  allow: ["your-org/sandbox-repo"]

paths:
  deny:
    - ".github/**"
    - "**/.git/**"
    - "**/.env*"
    - "**/secrets/**"
    - "**/*.pem"
    - "**/id_rsa*"
    - ".gitmodules"

# 'pat' reads GITHUB_TOKEN. 'app' issues a narrow token per call, and also needs client_id,
# installation_id, and GITHUB_APP_PRIVATE_KEY_FILE in the environment.
github_auth:
  mode: pat

# Writes are only allowed on branches with this prefix.
branches:
  write_prefix: "agent/"

# Pull requests are draft only unless this is true.
pull_requests:
  allow_non_draft: false

# Listing a dangerous tool in a role is not enough. It must also be enabled here.
dangerous_tools:
  github_merge_pull_request: { enabled: false }
  github_delete_branch: { enabled: true }

# How long a request or an approval stays valid.
approvals:
  ttl_minutes: 15
  max_pending_per_principal: 20
  # Let a real pull request review approve a merge. Needs a bot or GitHub App identity.
  github_review: { enabled: false, min_permission: write }

# Decides each write by what the agent has already read.
flow_guard:
  enabled: true
  window_minutes: 60
  on_private_to_public: deny # or require_approval
  on_untrusted_author: require_approval # or deny
  trusted_associations: [OWNER, MEMBER, COLLABORATOR]
  single_repo: false

# Post a commit status summarizing the agent's run. Needs Commit statuses: write, and anyone who
# can see the repository can read it. It does not prove a change came through this server.
receipts:
  enabled: false

# Only for repoward serve --http. It cannot run without both of these sections.
# http_auth:
#   issuer: "https://idp.example.com/"
#   audience: "https://mcp.example.com/mcp"
#   jwks_uri: "https://idp.example.com/.well-known/jwks.json"
#   algorithms: [RS256]
#   resource_server_url: "https://mcp.example.com/mcp"
#   allowed_hosts: ["mcp.example.com"]
#
# identity_map:
#   claim: groups
#   mapping:
#     mcp-readers: reader
#     mcp-devs: contributor

# Start a new audit file at this size. The chain continues across files. Off unless set.
# audit:
#   rotate_mb: 50

roles:
  reader:
    tools:
      - ping
      - github_list_issues
      - github_get_issue
      - github_search_code
      - github_get_file
      - ci_get_status
      - ci_get_job_logs
  contributor:
    inherits: reader
    tools:
      - github_create_branch
      - github_commit_files
      - github_create_pull_request
      - github_comment
    commit_limits: { max_files: 20, max_bytes: 200000 }
  maintainer:
    inherits: contributor
    tools: [github_delete_branch, github_merge_pull_request]
    require_approval: [github_delete_branch, github_merge_pull_request]

rate_limits:
  default: { per_minute: 30 }
  github_commit_files: { per_minute: 5 }
  github_search_code: { per_minute: 8 }

stdio:
  role: reader
